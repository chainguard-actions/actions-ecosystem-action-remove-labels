name: Test basic label removal (graceful failure on sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          labels: bug
          number: 1
          fail_on_error: 'false'

      - name: Assert action ran gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_on_error=false, the action should succeed even if the API call fails
          # (sentinel repo does not exist on GitHub, so API returns 404)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully (fail_on_error=false suppressed API error)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

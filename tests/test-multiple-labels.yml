name: Test removing multiple labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          labels: |
            bug
            enhancement
            help wanted
          number: 1
          fail_on_error: 'false'

      - name: Assert action ran gracefully with multiple labels
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_on_error=false, the action should succeed or fail gracefully
          # even when the sentinel repo does not exist on GitHub
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with multiple labels (fail_on_error=false)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
